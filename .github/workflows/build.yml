name: Build

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Test browser cryptography
        run: node scripts/test-crypto.mjs

      - uses: astral-sh/setup-uv@v6

      - name: Bundle frontend into Python package
        run: bash scripts/prepare-web-assets.sh

      - name: Test backend and publication security
        run: uv run --with httpx --locked --no-dev python -m unittest discover -s tests -v

      - name: Build Python wheel
        run: uv build --wheel --out-dir dist

      - name: Test wheel in a clean environment
        run: bash scripts/test-wheel.sh

      - name: Create application package
        shell: bash
        run: |
          version="develop-${GITHUB_SHA:0:7}"
          bash scripts/build-package.sh "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: flatnotes-package
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error
          retention-days: 14

  docker:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=develop
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
