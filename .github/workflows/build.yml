name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Test frontend, browser cryptography and docs
        run: npm test

      - name: Verify Docker branch tag rules
        run: bash scripts/test-docker-tags.sh

      - uses: astral-sh/setup-uv@v6

      - name: Bundle frontend into Python package
        run: bash scripts/prepare-web-assets.sh

      - name: Test backend and publication security
        run: uv run --with httpx --locked --no-dev python -m unittest discover -s tests -v

      - name: Run browser smoke tests
        run: bash scripts/test-browser.sh

      - name: Build Python wheel
        run: uv build --wheel --out-dir dist

      - name: Test wheel in a clean environment
        run: bash scripts/test-wheel.sh

      - name: Create application package
        shell: bash
        run: |
          version="build-${GITHUB_SHA:0:7}"
          bash scripts/build-package.sh "$version"

      - name: Verify packaged documentation
        run: bash scripts/test-package-docs.sh

      - uses: actions/upload-artifact@v4
        with:
          name: flatnotes-package
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error
          retention-days: 14

  docker:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive branch image tag
        id: branch
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/master'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: echo "tag=$(bash scripts/docker-branch-tag.sh "$BRANCH_NAME")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
            type=raw,value=${{ steps.branch.outputs.tag }},enable=${{ steps.branch.outputs.tag != '' }}
            type=raw,value=dev-${{ steps.branch.outputs.tag }}-${{ github.sha }},enable=${{ steps.branch.outputs.tag != '' }}
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
