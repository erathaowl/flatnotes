name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - develop
    paths:
      - '.github/release-request.txt'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.normalize.outputs.version }}
      tag: ${{ steps.normalize.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate and normalize release tag
        id: normalize
        shell: bash
        env:
          RAW_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [[ -z "$RAW_TAG" ]]; then
            RAW_TAG="$(head -n 1 .github/release-request.txt | tr -d '[:space:]')"
          fi
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $RAW_TAG" >&2
            exit 1
          fi
          version="${RAW_TAG#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            version="${version}.0"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Test browser cryptography
        run: node scripts/test-crypto.mjs

      - name: Test protected-note password policy
        run: node scripts/test-password-policy.mjs

      - uses: astral-sh/setup-uv@v6

      - name: Check project version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          assert version == os.environ["RELEASE_VERSION"], (
              f"Project version {version} does not match release version "
              f"{os.environ['RELEASE_VERSION']}"
          )
          PY

      - name: Bundle frontend into Python package
        run: bash scripts/prepare-web-assets.sh

      - name: Test backend and publication security
        run: uv run --with httpx --locked --no-dev python -m unittest discover -s tests -v

      - name: Build Python wheel
        run: uv build --wheel --out-dir dist

      - name: Test wheel in a clean environment
        run: bash scripts/test-wheel.sh

      - name: Create application package
        run: bash scripts/build-package.sh "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: flatnotes-release-package
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error

  docker:
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [version, package, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: flatnotes-release-package
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Replace the published tag only after all build and package tests pass.
            git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
            git push --force origin "refs/tags/$RELEASE_TAG"
            gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.whl \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.whl \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
