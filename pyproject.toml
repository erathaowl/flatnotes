[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flatnotes"
version = "6.2.0"
description = "A self-hosted Markdown note-taking app with optional public sharing."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "whoosh==2.7.4",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "aiofiles==25.1.0",
    "python-jose[cryptography]==3.5.0",
    "pyotp==2.10.0",
    "qrcode==8.2",
    "python-multipart==0.0.32",
]

[project.scripts]
flatnotes = "flatnotes.cli:main"

[dependency-groups]
dev = [
    "black",
    "flake8",
    "rope",
    "isort",
]

[tool.setuptools]
packages = [
    "flatnotes",
    "flatnotes.auth",
    "flatnotes.auth.local",
    "flatnotes.attachments",
    "flatnotes.attachments.file_system",
    "flatnotes.notes",
    "flatnotes.notes.file_system",
    "flatnotes.web",
]
include-package-data = true

[tool.setuptools.package-dir]
flatnotes = "server"

[tool.isort]
profile = "black"
line_length = 79
src_paths = ["server"]
